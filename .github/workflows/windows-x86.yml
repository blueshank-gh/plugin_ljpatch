name: Windows x86

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-server-debug:
    name: Build Server Debug
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repository
          submodules: recursive

      - name: Clean submodules (Local)
        shell: pwsh
        run: |
          cd repository
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Premake5
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'premake5.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'premake5'
          Invoke-WebRequest -Uri 'https://github.com/premake/premake-core/releases/download/v5.0.0/premake-5.0.0-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir 'premake5.exe') repository

      - name: Initialize Premake
        shell: pwsh
        run: |
          cd repository
          .\premake5.exe vs2022
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        shell: pwsh
        run: |
          cd repository\build
          msbuild plugin_ljpatch86_sv.sln /p:Configuration=Debug
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server_debug_x86_windows
          path: repository\bin\x86\Debug\*
          if-no-files-found: warn

