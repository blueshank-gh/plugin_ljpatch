name: Linux x64

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-server-debug:
    name: Build Server Debug
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib uuid-dev git ca-certificates zip unzip curl cmake pkg-config

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repository
          submodules: recursive

      - name: Clean submodules (Local)
        run: |
          cd repository
          # Clean untracked files inside submodules
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install Premake5
        run: |
          git clone --depth=1 https://github.com/premake/premake-core.git || true
          cd premake-core
          make -f Bootstrap.mak linux
          mv ./bin/release/premake5 ../repository
          cd ..

      - name: Initialize Premake
        run: |
          cd repository
          ./premake5 gmake
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build Dependency
        run: |
          cd repository/sdk64/projects/linux/gmake
          make -f common.make config=debug_x64
          make -f LZMA.make config=debug_x64
          make -f tier1.make config=debug_x64
          cd ../../../../..

      - name: Build
        run: |
          cd repository/build
          make -f plugin_ljpatch64_sv.make config=debug_x64
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server_debug_x64_linux
          path: repository/bin/x64/Debug/*
          if-no-files-found: warn

  build-server-release:
    name: Build Server Release
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib uuid-dev git ca-certificates zip unzip curl cmake pkg-config

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repository
          submodules: recursive

      - name: Clean submodules (Local)
        run: |
          cd repository
          # Clean untracked files inside submodules
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install Premake5
        run: |
          git clone --depth=1 https://github.com/premake/premake-core.git || true
          cd premake-core
          make -f Bootstrap.mak linux
          mv ./bin/release/premake5 ../repository
          cd ..

      - name: Initialize Premake
        run: |
          cd repository
          ./premake5 gmake
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build Dependency
        run: |
          cd repository/sdk64/projects/linux/gmake
          make -f common.make config=release_x64
          make -f LZMA.make config=release_x64
          make -f tier1.make config=release_x64
          cd ../../../../..

      - name: Build Release
        run: |
          cd repository/build
          make -f plugin_ljpatch64_sv.make config=release_x64
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server_release_x64_linux
          path: repository/bin/x64/Release/*
          if-no-files-found: warn